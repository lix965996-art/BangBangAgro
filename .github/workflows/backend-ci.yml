name: Backend CI

# 帮帮农后端 CI: 每次 push 到 main/develop 或 PR 时自动跑
# - 编译 188+ 个 Java 源文件
# - 跑 JUnit 单元测试
# - 生成测试报告 + 上传 artifact
# - 缓存 Maven 依赖加速二次构建

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'springboot/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'springboot/**'

jobs:
  build-and-test:
    name: 编译 + 单元测试
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 显示 Maven 版本
        run: mvn --version
        working-directory: ./springboot

      - name: 编译 (跳过测试)
        run: mvn -B clean compile -DskipTests
        working-directory: ./springboot

      - name: 跑单元测试
        run: mvn -B test
        working-directory: ./springboot
        continue-on-error: false

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: springboot/target/surefire-reports/
          retention-days: 7

      - name: 输出 JAR artifact (仅 main 分支)
        if: github.ref == 'refs/heads/main'
        run: mvn -B package -DskipTests
        working-directory: ./springboot

      - name: 上传 JAR
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bangbangagro-backend-jar
          path: springboot/target/*.jar
          retention-days: 30

  docker-build:
    name: Docker 镜像构建检查
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: 构建 Docker 镜像
        run: docker build -t bangbangagro-backend:ci-${{ github.sha }} ./springboot

      - name: 显示镜像信息
        run: docker images bangbangagro-backend
