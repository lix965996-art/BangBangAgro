<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>帮帮农</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
        }
        .loading-logo {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            border-radius: 24px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .loading-logo img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        .loading-text {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .loading-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }
        .loading-spinner {
            margin-top: 40px;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #app-container {
            width: 100%;
            height: 100vh;
            display: none;
        }
        #app-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- 加载页面 -->
    <div class="loading" id="loading">
        <div class="loading-logo">
            <img src="Logo.jpg" alt="Logo" onerror="this.style.display='none'">
        </div>
        <div class="loading-text">帮帮农</div>
        <div class="loading-subtitle">智慧农业管理平台</div>
        <div class="loading-spinner"></div>
    </div>

    <!-- App 容器 -->
    <div id="app-container">
        <iframe id="app-iframe" src=""></iframe>
    </div>

    <script>
        // 配置服务器地址
        // 请修改为你的实际服务器地址
        var SERVER_URL = 'http://你的服务器IP:9090';

        // 加载 App
        function loadApp() {
            var loading = document.getElementById('loading');
            var appContainer = document.getElementById('app-container');
            var appIframe = document.getElementById('app-iframe');

            // 设置 iframe 地址
            appIframe.src = SERVER_URL;

            // 监听 iframe 加载完成
            appIframe.onload = function() {
                loading.style.display = 'none';
                appContainer.style.display = 'block';
            };

            // 监听 iframe 加载错误
            appIframe.onerror = function() {
                loading.innerHTML = '<div class="loading">' +
                    '<div class="loading-text">加载失败</div>' +
                    '<div class="loading-subtitle">请检查网络连接或服务器地址</div>' +
                    '</div>';
            };

            // 超时处理（10秒）
            setTimeout(function() {
                if (loading.style.display !== 'none') {
                    loading.innerHTML = '<div class="loading">' +
                        '<div class="loading-text">加载超时</div>' +
                        '<div class="loading-subtitle">请检查服务器是否正常运行</div>' +
                        '</div>';
                }
            }, 10000);
        }

        // 页面加载完成后启动 App
        document.addEventListener('DOMContentLoaded', function() {
            // 检查是否在 HBuilderX 环境中
            if (typeof plus !== 'undefined') {
                // HBuilderX 环境
                plus.nativeUI.showWaiting('加载中...');
                loadApp();
                plus.nativeUI.closeWaiting();
            } else {
                // 浏览器环境
                loadApp();
            }
        });
    </script>
</body>
</html>
